name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check text rules
        run: python3 scripts/check_strings.py

      - name: Test the check script
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install
        run: uv sync --project eval --locked

      - name: Lint
        run: |
          uv run --project eval ruff check eval scripts
          uv run --project eval ruff format --check eval scripts

      - name: Test the evaluation code
        run: uv run --project eval pytest eval/tests

      - name: Dry run of the evaluation
        run: uv run --project eval python -m plate_eval run --dry-run
