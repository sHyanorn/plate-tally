name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Sources/**"
      - "Package.swift"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The runner image keeps one Xcode per minor version at a path like this.
  XCODE_APP: /Applications/Xcode_26.6.app
  XCODEGEN_VERSION: 2.48.0
  XCODEGEN_SHA256: 620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892
  # Rises with every run of this workflow. Signing and upload must be added to this
  # file: a new workflow file counts its runs from 1.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Unsigned build on macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "error: expected $XCODE_APP, saw: $(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort | tr '\n' ' ')" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      # The simulator boots while the project is generated and built. The test step waits for it.
      - name: Boot a simulator
        run: |
          udid=$(python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          phones = sorted(
              (device["name"], device["udid"])
              for runtime, devices in data["devices"].items()
              if "iOS-26" in runtime
              for device in devices
              if device["name"].startswith("iPhone")
          )
          if not phones:
              seen = sorted(runtime for runtime, devices in data["devices"].items() if devices)
              sys.exit("error: expected an iPhone simulator on iOS 26, saw runtimes: " + ", ".join(seen))
          chosen = next((phone for phone in phones if phone[0] == "iPhone 17"), phones[0])
          print("simulator: %s %s" % chosen, file=sys.stderr)
          print(chosen[1])
          PY
          )
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"

      - name: Install XcodeGen
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the project
        run: |
          xcodegen --version
          xcodegen generate --spec App/project.yml

      - name: Show Xcode, SDKs, schemes and simulators
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          xcodebuild -list -project App/PlateTally.xcodeproj
          xcrun simctl list devices available

      # The test step runs this build as it is, so the app and its tests compile once.
      - name: Build the app and its tests for the simulator
        run: |
          xcodebuild build-for-testing \
            -project App/PlateTally.xcodeproj \
            -scheme PlateTally \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Archive for a device without signing
        run: |
          xcodebuild archive \
            -project App/PlateTally.xcodeproj \
            -scheme PlateTally \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PlateTally.xcarchive" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Write evidence
        run: |
          archive="$RUNNER_TEMP/PlateTally.xcarchive"
          app="$archive/Products/Applications/PlateTally.app"
          {
            echo "## xcodebuild -version"
            xcodebuild -version
            echo "## Archive Info.plist"
            plutil -p "$archive/Info.plist"
            echo "## App Info.plist"
            plutil -p "$app/Info.plist"
            echo "## Build platform, minimum system and SDK"
            xcrun vtool -show-build "$app/PlateTally"
            echo "## Signature (not signed is expected)"
            codesign -dv "$app" 2>&1 || true
            echo "## Archive contents"
            find "$archive" -maxdepth 4 | sort
          } | tee "$RUNNER_TEMP/evidence.txt"

      - name: Upload evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-archive-evidence
          path: ${{ runner.temp }}/evidence.txt
          retention-days: 1
          if-no-files-found: error

      # The unit tests and the UI tests run the app on a fresh folder, a fixed clock and a canned
      # reply (App/Sources/UITestHarness.swift), so no test touches the network or a key.
      - name: Test the app on the simulator
        run: |
          xcrun simctl bootstatus "$UDID" -b
          mkdir "$RUNNER_TEMP/screenshots"
          date -u
          status=0
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" xcodebuild test-without-building \
            -project App/PlateTally.xcodeproj \
            -scheme PlateTally \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/app-tests.xcresult" 2>&1 \
            | tee "$RUNNER_TEMP/app-tests.log" || status=$?
          date -u
          exit "$status"

      # The package tests ran on Linux already. This run checks them against the Foundation of the
      # platform the app ships on.
      - name: Test the package on the simulator
        run: |
          xcodebuild -list
          xcodebuild test \
            -scheme PlateTallyKit-Package \
            -destination "id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/package-tests.xcresult" 2>&1 | tee "$RUNNER_TEMP/package-tests.log"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 3
          if-no-files-found: warn

      - name: Upload the result bundle of the app tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-tests-xcresult
          path: ${{ runner.temp }}/app-tests.xcresult
          retention-days: 3
          if-no-files-found: warn

      - name: Summarize failures
        if: always()
        run: |
          {
            echo "## Errors and failed tests"
            echo '```'
            (grep -h -E "error:|failed|FAILED" "$RUNNER_TEMP"/*.log || true) | sort -u | sed -n '1,100p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
