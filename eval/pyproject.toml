[project]
name = "plate-eval"
version = "0.1.0"
description = "Calorie estimation evaluation of two Claude models on Nutrition5k overhead photos"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["anthropic>=2.12,<3", "numpy"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plate_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
