# Source of the generated Xcode project (D008). The bundle identifier, the display
# name, the version and the deployment target are set here and nowhere else.
name: PlateTally
options:
  deploymentTarget:
    iOS: "26.0"
  # The screens are in Chinese and English (D015). The catalogs in Sources hold both.
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
# The logic lives in the Swift package at the repository root.
packages:
  PlateTallyKit:
    path: ..
targets:
  PlateTally:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: PlateTallyKit
        product: Core
      - package: PlateTallyKit
        product: Cost
      - package: PlateTallyKit
        product: Energy
      - package: PlateTallyKit
        product: Estimation
      - package: PlateTallyKit
        product: Ledger
      - package: PlateTallyKit
        product: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shyanorn.plate-tally
        MARKETING_VERSION: "0.1.0"
        # CI overrides this with the workflow run number, so every build is higher.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # The platform preset says 1,2. This app is for an iPhone.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Plate Tally
        # Without these two lines the generated file holds the fixed values 1.0 and 1.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app has no encryption of its own. The key skips the export questionnaire
        # at every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleLocalizations: [en, zh-Hans]
        # The camera asks for permission with this text. The photo library needs none.
        NSCameraUsageDescription: Takes a photo of a meal.
        # One orientation keeps the layouts simple and the screenshots comparable.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  # The unit tests run inside the app, so they see its code and the package modules it links.
  PlateTallyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnitTests]
    dependencies:
      - target: PlateTally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shyanorn.plate-tally.unit-tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
  PlateTallyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PlateTally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shyanorn.plate-tally.ui-tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
# XcodeGen writes a scheme only for a declared one, and the CI commands name it.
schemes:
  PlateTally:
    build:
      targets:
        PlateTally: all
    test:
      targets:
        - PlateTallyTests
        - PlateTallyUITests
